name: ColdFire kernel source discovery

on:
  push:
    branches: [work/coldfire-boot-gate]
    paths:
      - 'scripts/discover-coldfire-kernel.sh'
      - 'Makefile'
      - 'scripts/lib.sh'
      - 'scripts/fetch-sources.sh'
      - 'versions.conf'
      - '.github/workflows/coldfire-kernel-discovery.yml'
  pull_request:
    paths:
      - 'scripts/discover-coldfire-kernel.sh'
      - 'Makefile'
      - 'versions.conf'
      - '.github/workflows/coldfire-kernel-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Fetch pinned Linux kernel archive
        shell: bash
        run: |
          set -euo pipefail
          . ./versions.conf
          mkdir -p sources
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            -o "sources/linux-$LINUX_VERSION.tar.xz" \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$LINUX_VERSION.tar.xz"
      - name: Inspect MCF5208 kernel support
        run: make coldfire-discover
      - name: Validate MCF5208 defconfig with upstream Kbuild
        shell: bash
        run: |
          set -euo pipefail
          . ./versions.conf
          mkdir -p /tmp/mikros-linux-src
          tar -xJf "sources/linux-$LINUX_VERSION.tar.xz" -C /tmp/mikros-linux-src --strip-components=1
          test -f /tmp/mikros-linux-src/arch/m68k/configs/m5208evb_defconfig
          make -C /tmp/mikros-linux-src ARCH=m68k O="$GITHUB_WORKSPACE/out/coldfire-kconfig" m5208evb_defconfig
          grep -E '^(CONFIG_COLDFIRE|CONFIG_M5208|CONFIG_MMU|CONFIG_M68K)' out/coldfire-kconfig/.config || true
          test -s out/coldfire-kconfig/.config
          grep -qx 'CONFIG_COLDFIRE=y' out/coldfire-kconfig/.config
          if grep -qx 'CONFIG_MMU=y' out/coldfire-kconfig/.config; then
            echo 'Unexpected MMU-enabled ColdFire configuration' >&2
            exit 1
          fi
      - name: Probe available ColdFire cross-compilers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/coldfire-kconfig
          {
            echo 'Cross-compiler availability on ubuntu-24.04:'
            apt-cache show gcc-m68k-linux-gnu 2>/dev/null | grep -m 1 '^Version:' || true
            apt-cache show gcc-m68k-linux-gnu 2>/dev/null | grep -m 1 '^Package:' || true
            echo 'Compiler target expected by MikrOS: m68k-linux-uclibc-'
            echo 'Compiler availability does not establish ColdFire V2 compatibility.'
          } | tee out/coldfire-kconfig/toolchain-probe.txt
      - name: Test distro m68k compiler for ColdFire V2 code generation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
          cat > /tmp/mikros-coldfire-probe.c <<'EOF'
          int mikros_coldfire_probe(int x) { return x + 1; }
          EOF
          {
            m68k-linux-gnu-gcc --version | head -n 1
            if m68k-linux-gnu-gcc -mcpu=5208 -ffreestanding -fno-builtin -c \
              /tmp/mikros-coldfire-probe.c -o /tmp/mikros-coldfire-probe.o; then
              echo 'MCF5208 compiler option: ACCEPTED'
              m68k-linux-gnu-readelf -h /tmp/mikros-coldfire-probe.o
              m68k-linux-gnu-objdump -dr /tmp/mikros-coldfire-probe.o
            else
              echo 'MCF5208 compiler option: REJECTED'
              echo 'Do not use this compiler for the kernel without a qualified alternative.'
            fi
          } | tee out/coldfire-kconfig/compiler-m5208-probe.txt
      - name: Attempt actual MCF5208 Linux kernel build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y make bc bison flex libssl-dev libelf-dev
          mkdir -p out/coldfire-kconfig
          set +e
          make -C /tmp/mikros-linux-src ARCH=m68k CROSS_COMPILE=m68k-linux-gnu- \
            O="$GITHUB_WORKSPACE/out/coldfire-kconfig" -j2 vmlinux \
            > out/coldfire-kconfig/kernel-build.log 2>&1
          rc=$?
          set -e
          echo "kernel_build_exit_code=$rc" | tee out/coldfire-kconfig/kernel-build-result.txt
          tail -n 100 out/coldfire-kconfig/kernel-build.log
          if [ "$rc" -eq 0 ] && [ -s out/coldfire-kconfig/vmlinux ]; then
            echo 'MCF5208 kernel compilation: PASS' | tee -a out/coldfire-kconfig/kernel-build-result.txt
          else
            echo 'MCF5208 kernel compilation: FAIL (investigate build log)' | tee -a out/coldfire-kconfig/kernel-build-result.txt
          fi
      - name: Preserve boot candidate and inspect kernel image
        shell: bash
        run: |
          set -euo pipefail
          test -s out/coldfire-kconfig/vmlinux
          mkdir -p out/coldfire-kconfig/boot
          cp out/coldfire-kconfig/vmlinux out/coldfire-kconfig/boot/vmlinux
          m68k-linux-gnu-readelf -h out/coldfire-kconfig/boot/vmlinux | \
            tee out/coldfire-kconfig/boot/vmlinux-elf.txt
          sha256sum out/coldfire-kconfig/boot/vmlinux | \
            tee out/coldfire-kconfig/boot/vmlinux-sha256.txt
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldfire-kernel-discovery
          path: |
            out/m68k-coldfire-v2/minimal/meta/kernel-discovery.txt
            out/coldfire-kconfig/.config
            out/coldfire-kconfig/toolchain-probe.txt
            out/coldfire-kconfig/compiler-m5208-probe.txt
            out/coldfire-kconfig/kernel-build-result.txt
            out/coldfire-kconfig/kernel-build.log
            out/coldfire-kconfig/boot/
          if-no-files-found: warn
