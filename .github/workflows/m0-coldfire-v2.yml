name: M0 ColdFire V2 toolchain

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build-toolchain-coldfire-v2.sh'
      - 'targets/m68k-coldfire-v2.conf'
      - 'versions.conf'
      - 'scripts/build-coldfire-v2.sh'
      - 'scripts/fetch-sources.sh'
      - '.github/workflows/m0-coldfire-v2.yml'
  pull_request:
    paths:
      - 'scripts/build-toolchain-coldfire-v2.sh'
      - 'targets/m68k-coldfire-v2.conf'
      - 'versions.conf'
      - 'scripts/build-coldfire-v2.sh'
      - 'scripts/fetch-sources.sh'
      - '.github/workflows/m0-coldfire-v2.yml'
  workflow_dispatch:

jobs:
  coldfire-v2-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils bzip2 cpio file rsync bc genromfs qemu-system-misc

      - name: Cache ColdFire V2 toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: out/toolchains/m68k-coldfire-v2
          key: coldfire-v2-uclibc-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-coldfire-v2.sh') }}

      - name: Build ColdFire V2 no-MMU toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh ./scripts/build-toolchain-coldfire-v2.sh

      - name: Save ColdFire V2 toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/toolchains/m68k-coldfire-v2
          key: coldfire-v2-uclibc-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-coldfire-v2.sh') }}

      - name: Fetch pinned sources
        run: sh ./scripts/fetch-sources.sh

      - name: Build MCF5208 no-MMU kernel
        run: sh ./scripts/build-coldfire-v2.sh

      - name: Verify MCF5208 compiler and FLAT toolchain
        run: |
          TC=out/toolchains/m68k-coldfire-v2/toolchain
          CC="$TC/bin/m68k-linux-uclibc-gcc"
          "$CC" -dumpmachine
          printf 'int main(void){return 0;}\n' > /tmp/mikros-cf-probe.c
          "$CC" -mcpu=5208 -Os /tmp/mikros-cf-probe.c -o /tmp/mikros-cf-probe
          file /tmp/mikros-cf-probe
          file /tmp/mikros-cf-probe | grep -q "BFLT executable"

      - name: Smoke boot MCF5208 kernel in QEMU
        run: |
          set -eu
          timeout 25s qemu-system-m68k -M mcf5208evb -cpu m5208 -kernel out/m68k-coldfire-v2/minimal/boot/vmlinux -nographic -monitor none > /tmp/mcf5208-boot.log 2>&1 || rc=$?
          cat /tmp/mcf5208-boot.log
          grep -Fq "MikrOS ColdFire V2 smoke: PASS" /tmp/mcf5208-boot.log || { echo "ColdFire initramfs userspace did not start" >&2; exit 1; }
