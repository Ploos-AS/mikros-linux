name: M0 m68k toolchain

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build-toolchain-m68k.sh'
      - 'versions.conf'
      - '.github/workflows/m0-m68k-toolchain.yml'
  pull_request:
    paths:
      - 'scripts/build-toolchain-m68k.sh'
      - 'versions.conf'
      - '.github/workflows/m0-m68k-toolchain.yml'
  workflow_dispatch:

jobs:
  m68k-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils bzip2 cpio file rsync bc

      - name: Cache m68k uClibc-ng toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: out/toolchains/m68k
          key: m68k-uclibc-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-m68k.sh') }}

      - name: Build m68k uClibc-ng toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh ./scripts/build-toolchain-m68k.sh

      - name: Save m68k uClibc-ng toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/toolchains/m68k
          key: m68k-uclibc-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-m68k.sh') }}

      - name: Verify 68020 compiler
        run: |
          out/toolchains/m68k/toolchain/bin/m68k-linux-uclibc-gcc -dumpmachine
          printf 'int main(void){return 0;}\n' > /tmp/mikros-m68k-probe.c
          out/toolchains/m68k/toolchain/bin/m68k-linux-uclibc-gcc -m68020 -Os /tmp/mikros-m68k-probe.c -o /tmp/mikros-m68k-probe
          file /tmp/mikros-m68k-probe
