name: M0 x86 qualification

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  x86-i586-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib curl xz-utils bzip2 cpio qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Fetch pinned sources
        run: sh ./scripts/fetch-sources.sh

      - name: Cache local i586 musl toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: out/toolchains/x86-i586
          key: i586-musl-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-x86.sh') }}

      - name: Build local i586 musl toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh ./scripts/build-toolchain-x86.sh

      - name: Save local i586 musl toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/toolchains/x86-i586
          key: i586-musl-${{ runner.os }}-${{ hashFiles('versions.conf', 'scripts/build-toolchain-x86.sh') }}

      - name: Add i586 toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/out/toolchains/x86-i586/bin" >> "$GITHUB_PATH"

      - name: Build x86-i586 image
        run: |
          set -o pipefail
          mkdir -p out/x86-i586/minimal
          sh ./scripts/build-x86-i586.sh minimal out/x86-i586/minimal 2>&1 | tee out/x86-i586/minimal/build.log

      - name: Record resolved x86 kernel configuration
        run: |
          CFG=out/x86-i586/minimal/work/linux/.config
          cp "$CFG" out/x86-i586/minimal/kernel.config
          grep -E '^(CONFIG_(M586|M686|PRINTK|TTY|SERIAL_8250|SERIAL_8250_CONSOLE|SERIAL_CORE|SERIAL_CORE_CONSOLE|EARLY_PRINTK|DEBUG_KERNEL|BLK_DEV_INITRD|RD_GZIP|DEVTMPFS|DEVTMPFS_MOUNT|BINFMT_ELF|RELOCATABLE|PHYSICAL_START|PHYSICAL_ALIGN)=|# CONFIG_(M586|M686|PRINTK|TTY|SERIAL_8250|SERIAL_8250_CONSOLE|SERIAL_CORE|SERIAL_CORE_CONSOLE|EARLY_PRINTK|DEBUG_KERNEL|BLK_DEV_INITRD|RD_GZIP|DEVTMPFS|DEVTMPFS_MOUNT|BINFMT_ELF|RELOCATABLE).*not set)' "$CFG" | sort | tee out/x86-i586/minimal/kernel-config-summary.log

      - name: Inspect x86 bzImage boot header
        run: |
          python3 - <<'PY' | tee out/x86-i586/minimal/bzimage-header.log
          from pathlib import Path
          p = Path("out/x86-i586/minimal/boot/bzImage").read_bytes()
          print("size:", len(p))
          print("boot_flag:", p[0x1fe:0x200].hex())
          print("header:", p[0x202:0x206].decode("ascii", "replace"))
          print("protocol:", f"{p[0x207]:02x}{p[0x206]:02x}")
          print("setup_sects:", p[0x1f1] or 4)
          assert p[0x1fe:0x200] == b"\\x55\\xaa", "invalid x86 boot flag"
          assert p[0x202:0x206] == b"HdrS", "missing Linux boot protocol header"
          PY

      - name: Diagnose early x86 boot
        run: |
          OUT=out/x86-i586/minimal
          set +e
          timeout --signal=TERM --kill-after=2s 8s qemu-system-i386 \
            -M pc -cpu pentium -m 32M \
            -kernel "$OUT/boot/bzImage" \
            -append "earlyprintk=serial,ttyS0,115200 console=ttyS0,115200" \
            -display none -serial stdio -monitor none -no-reboot \
            >"$OUT/qemu-kernel-only.log" 2>&1
          echo "kernel-only rc=$?" | tee -a "$OUT/qemu-kernel-only.log"

          timeout --signal=TERM --kill-after=1s 2s qemu-system-i386 \
            -M pc -cpu pentium -m 32M \
            -kernel "$OUT/boot/bzImage" \
            -append "earlyprintk=serial,ttyS0,115200 console=ttyS0,115200" \
            -display none -serial none -monitor none -no-reboot \
            -d cpu_reset,int,guest_errors -D "$OUT/qemu-debug.full.log"
          echo "debug rc=$?"
          head -n 120 "$OUT/qemu-debug.full.log" > "$OUT/qemu-debug-head.log"
          tail -n 400 "$OUT/qemu-debug.full.log" > "$OUT/qemu-debug.log"
          rm -f "$OUT/qemu-debug.full.log"
          set -e

      - name: Compare QEMU x86 CPU models
        run: |
          OUT=out/x86-i586/minimal
          for cpu in pentium pentium2 qemu32; do
            log="$OUT/qemu-cpu-$cpu.log"
            set +e
            timeout --signal=TERM --kill-after=1s 8s qemu-system-i386 \
              -M pc -cpu "$cpu" -m 32M \
              -kernel "$OUT/boot/bzImage" \
              -append "earlyprintk=serial,ttyS0,115200 console=ttyS0,115200" \
              -display none -serial stdio -monitor none -no-reboot \
              >"$log" 2>&1
            rc=$?
            set -e
            echo "cpu=$cpu rc=$rc" | tee -a "$log"
          done

      - name: Build upstream-style i586 control kernel
        run: |
          OUT=out/x86-i586/minimal
          K="$OUT/work/linux-control"
          rm -rf "$K"
          mkdir -p "$K"
          . ./versions.conf
          tar -xJf "sources/linux-$LINUX_VERSION.tar.xz" -C "$K" --strip-components=1
          make -C "$K" ARCH=x86 i386_defconfig
          "$K/scripts/config" --file "$K/.config" --disable M686
          "$K/scripts/config" --file "$K/.config" --enable M586
          make -C "$K" ARCH=x86 olddefconfig >/dev/null
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_USER
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_BYREF
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_BYREF_ALL
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STACKLEAK
          "$K/scripts/config" --file "$K/.config" --enable INIT_STACK_NONE
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGINS
          grep -q '^CONFIG_M586=y$' "$K/.config"
          grep -q '^# CONFIG_GCC_PLUGINS is not set$' "$K/.config"
          make -C "$K" -j2 ARCH=x86 CROSS_COMPILE=i586-linux-musl- bzImage
          cp "$K/arch/x86/boot/bzImage" "$OUT/boot/bzImage-control"
          set +e
          timeout --signal=TERM --kill-after=1s 12s qemu-system-i386 \
            -M pc -cpu pentium -m 32M \
            -kernel "$OUT/boot/bzImage-control" \
            -append "earlyprintk=serial,ttyS0,115200 console=ttyS0,115200" \
            -display none -serial stdio -monitor none -no-reboot \
            >"$OUT/qemu-control-kernel.log" 2>&1
          rc=$?
          set -e
          echo "control kernel rc=$rc" | tee -a "$OUT/qemu-control-kernel.log"
          cat "$OUT/qemu-control-kernel.log"

      - name: Build native-GCC i586 control kernel
        run: |
          OUT=out/x86-i586/minimal
          K="$OUT/work/linux-native-control"
          rm -rf "$K"
          mkdir -p "$K"
          . ./versions.conf
          tar -xJf "sources/linux-$LINUX_VERSION.tar.xz" -C "$K" --strip-components=1
          make -C "$K" ARCH=x86 i386_defconfig
          "$K/scripts/config" --file "$K/.config" --disable M686
          "$K/scripts/config" --file "$K/.config" --enable M586
          make -C "$K" ARCH=x86 olddefconfig >/dev/null
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_USER
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_BYREF
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STRUCTLEAK_BYREF_ALL
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGIN_STACKLEAK
          "$K/scripts/config" --file "$K/.config" --enable INIT_STACK_NONE
          "$K/scripts/config" --file "$K/.config" --disable GCC_PLUGINS
          grep -q '^CONFIG_M586=y$' "$K/.config"
          make -C "$K" -j2 ARCH=x86 bzImage
          cp "$K/arch/x86/boot/bzImage" "$OUT/boot/bzImage-native-control"
          set +e
          timeout --signal=TERM --kill-after=1s 12s qemu-system-i386 \
            -M pc -cpu pentium -m 32M \
            -kernel "$OUT/boot/bzImage-native-control" \
            -append "earlyprintk=serial,ttyS0,115200 console=ttyS0,115200" \
            -display none -serial stdio -monitor none -no-reboot \
            >"$OUT/qemu-native-control-kernel.log" 2>&1
          rc=$?
          set -e
          echo "native control kernel rc=$rc" | tee -a "$OUT/qemu-native-control-kernel.log"
          cat "$OUT/qemu-native-control-kernel.log"

      - name: Boot-test x86-i586 image via GRUB ISO
        run: |
          OUT=out/x86-i586/minimal
          ISO="$OUT/grub-iso"
          mkdir -p "$ISO/boot/grub"
          cp "$OUT/boot/bzImage" "$ISO/boot/bzImage"
          cp "$OUT/boot/initramfs.cpio.gz" "$ISO/boot/initramfs.cpio.gz"
          cat > "$ISO/boot/grub/grub.cfg" <<'EOF'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "MikrOS Linux i586" {
            linux /boot/bzImage earlyprintk=serial,ttyS0,115200 console=ttyS0,115200 rdinit=/sbin/init
            initrd /boot/initramfs.cpio.gz
          }
          EOF
          grub-mkrescue -o "$OUT/mikros-i586.iso" "$ISO" >"$OUT/grub-mkrescue.log" 2>&1

          set +e
          timeout --signal=TERM --kill-after=1s 20s qemu-system-i386 \
            -M pc -cpu pentium -m 32M \
            -cdrom "$OUT/mikros-i586.iso" -boot d \
            -display none -serial stdio -monitor none -no-reboot \
            >"$OUT/qemu-grub.log" 2>&1
          rc=$?
          set -e
          echo "grub qemu rc=$rc" | tee -a "$OUT/qemu-grub.log"
          cat "$OUT/qemu-grub.log"
          grep -q "MikrOS Linux" "$OUT/qemu-grub.log" || {
            echo "FAIL: MikrOS userspace banner not observed via GRUB" >&2
            exit 1
          }
          echo "PASS: x86-i586/minimal reached MikrOS userspace via BIOS/GRUB"

      - name: Diagnose QEMU direct-kernel boot
        continue-on-error: true
        run: |
          sh ./scripts/qemu-smoke-x86.sh out/x86-i586/minimal

      - name: Upload qualification logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikros-x86-i586-minimal
          path: |
            out/x86-i586/minimal/boot/
            out/x86-i586/minimal/SHA256SUMS
            out/x86-i586/minimal/build.log
            out/x86-i586/minimal/kernel.config
            out/x86-i586/minimal/kernel-config-summary.log
            out/x86-i586/minimal/bzimage-header.log
            out/x86-i586/minimal/qemu-kernel-only.log
            out/x86-i586/minimal/qemu-control-kernel.log
            out/x86-i586/minimal/qemu-native-control-kernel.log
            out/x86-i586/minimal/qemu-cpu-*.log
            out/x86-i586/minimal/qemu-debug-head.log
            out/x86-i586/minimal/qemu-debug.log
            out/x86-i586/minimal/grub-mkrescue.log
            out/x86-i586/minimal/qemu-grub.log
            out/x86-i586/minimal/qemu-smoke.log
          if-no-files-found: warn
