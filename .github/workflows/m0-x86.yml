name: M0 x86 qualification

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  x86-i586-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib curl xz-utils bzip2 cpio qemu-system-x86

      - name: Prepare local i586 bootstrap toolchain
        run: |
          ./scripts/build-toolchain-x86.sh
          echo "$GITHUB_WORKSPACE/out/toolchains/x86-i586/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned sources
        run: make fetch

      - name: Build and boot-test
        run: make TARGET=x86-i586 PROFILE=minimal smoke

      - name: Upload qualification logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikros-x86-i586-minimal
          path: |
            out/x86-i586/minimal/boot/
            out/x86-i586/minimal/SHA256SUMS
            out/x86-i586/minimal/qemu-smoke.log
          if-no-files-found: warn
